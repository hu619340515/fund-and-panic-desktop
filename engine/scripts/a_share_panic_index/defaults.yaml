  qvix_change_5m: [[-0.05, 5], [0, 35], [0.02, 60], [0.05, 85], [0.10, 99]]
  projected_amount_shortfall: [[-0.5, 10], [-0.2, 25], [0, 45], [0.2, 65], [0.5, 85], [1, 99]]
