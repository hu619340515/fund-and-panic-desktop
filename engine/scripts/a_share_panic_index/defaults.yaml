  downside_turnover_shock: [[0, 20], [0.001, 40], [0.003, 60], [0.008, 82], [0.02, 99]]
  amount_acceleration_stress: [[0, 20], [0.001, 40], [0.003, 60], [0.008, 82], [0.02, 99]]

realtime:
  refresh_seconds: 60
  minimum_refresh_seconds: 30
  bucket_minutes: 5
  fast_rise_bypass_threshold: 8
  rising_alpha: 0.65
  falling_alpha: 0.35

reference:
  self_calibration_start_days: 20
  same_time_history_days: 60
  mature_history_days: 120
  proxy_history_natural_days: 180
  maximum_historical_blend: 0.75
  feature_historical_blend_cap: 0.50

freshness:
  index_max_age_seconds: 120
  breadth_max_age_seconds: 180
  limits_max_age_seconds: 180
  futures_max_age_seconds: 120
  qvix_max_age_seconds: 300
  max_cross_source_skew_seconds: 120

futures:
  minimum_days_to_expiry: 5
  annualization_days: 365

quality:
  complete_min_coverage: 0.95
  provisional_min_coverage: 0.80
  qvix_missing_confidence_cap: 85
  bootstrap_confidence_cap: 75
  index_cross_source_tolerance: 0.003
  futures_cross_source_tolerance: 0.005
  qvix_cross_source_tolerance: 0.25

network:
  max_retries: 3
  retry_delay_seconds: 2
  provider_timeout_seconds: 20
  total_refresh_timeout_seconds: 45
  circuit_failure_threshold: 3
  circuit_cooldown_seconds: 300

market:
  calendar: XSHG
  timezone: Asia/Shanghai
  finalization_time: "15:10"
  index_symbol: sh000300
  etf_symbols: [sh510300, sz159919, sh510050, sh510500]

providers:
  index: [mootdx, tencent, eastmoney, sina]
  breadth: [eastmoney, sina, mootdx, tencent]
  limits: [eastmoney, xuangubao, breadth_estimate]
  futures: [sina_futures, akshare_futures]
  qvix: [qvix_300_index, qvix_300_etf]
  proxy_curve: [baostock, mootdx, sina, tencent, eastmoney]

database:
  path: ./data_cache/panic_index.db
  backup_directory: ./data_cache/backups

logging:
  directory: ./logs
  retention_days: 30
  level: INFO
