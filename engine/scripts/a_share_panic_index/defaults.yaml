    gap_down_z: 0.15
    decline_from_previous_close_z: 0.25
    realized_vol_so_far_z: 0.20
    downside_vol_so_far_z: 0.20
    range_so_far_z: 0.10
    down_shock_5m_z: 0.10
  breadth:
    decline_share: 0.25
    severe_decline_share: 0.20
    extreme_decline_share: 0.15
    median_return_stress: 0.20
    limit_down_intensity: 0.12
    limit_imbalance: 0.08
  derivatives:
    if_pressure: 0.60
    implied_volatility: 0.40
  if_pressure:
    front_annualized_basis: 0.55
    next_annualized_basis: 0.20
    basis_curve_stress: 0.15
    basis_widening_5m: 0.10
  implied_volatility:
    qvix_level: 0.55
    qvix_change_from_previous_close: 0.30
    qvix_change_5m: 0.15
  liquidity:
    projected_amount_shortfall: 0.35
    incremental_5m_illiquidity: 0.25
    downside_turnover_shock: 0.25
    amount_acceleration_stress: 0.15

